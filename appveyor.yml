version: 1.0.{build}

image: Visual Studio 2026

configuration: Release

branches:
  only:
    - main

clone_folder: c:\projects\domain-driven-design-sample

environment:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_INSTALL_DIR: C:\Users\appveyor\.dotnet
  DOTNET_ROOT: C:\Users\appveyor\.dotnet
  NUGET_PACKAGES: C:\projects\nuget-packages
  PATH: C:\Users\appveyor\.dotnet;%PATH%

cache:
  - C:\projects\nuget-packages -> **\*.csproj, **\packages.lock.json

skip_commits:
  files:
    - README.md
    - AGENTS.md

install:
  - ps: |
      Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
      .\dotnet-install.ps1 -Channel 10.0 -InstallDir $env:DOTNET_INSTALL_DIR
      dotnet --version

before_build:
  - dotnet --info
  - dotnet restore OrderingSystem.slnx

build_script:
  - dotnet build OrderingSystem.slnx --configuration Release --no-restore

test_script:
  - dotnet test tests/Ordering.Domain.Tests/Ordering.Domain.Tests.csproj --configuration Release --no-restore --no-build --logger "trx;LogFileName=test-results.trx"
  - dotnet test tests/Ordering.Application.Tests/Ordering.Application.Tests.csproj --configuration Release --no-restore --no-build --logger "trx;LogFileName=test-results.trx"

artifacts:
  - path: tests/**/TestResults/*.trx
    name: test-results
